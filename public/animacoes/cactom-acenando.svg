<svg id="cactom" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Cactom acenando">
  <style>
    /* Respiração: escala a partir da base do corpo (200,350) */
    #corpo {
      transform-box: view-box;
      transform-origin: 200px 350px;
      animation: respirar 2.4s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    /* Aceno: gira a partir do ombro direito (290,250) */
    #braço-direito {
      transform-box: view-box;
      transform-origin: 290px 250px;
      animation: acenar 2.4s cubic-bezier(.34, 1.56, .64, 1) infinite;
    }
    /* Balanço leve do braço esquerdo, a partir do ombro (110,250) */
    #braço-esquerdo {
      transform-box: view-box;
      transform-origin: 110px 250px;
      animation: balancar 2.4s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    /* Flor acompanha o aceno com atraso (follow-through) */
    #flor {
      transform-box: view-box;
      transform-origin: 200px 112px;
      animation: flor 2.4s cubic-bezier(.34, 1.56, .64, 1) infinite;
    }
    /* Sobrancelhas sobem junto com o aceno */
    #sobrancelhas {
      animation: sobrancelhas 2.4s cubic-bezier(.34, 1.56, .64, 1) infinite;
    }
    /* Piscada */
    #olhos {
      transform-box: view-box;
      transform-origin: 200px 200px;
      animation: piscar 4.8s ease-in-out infinite;
    }
    #sombra {
      transform-box: view-box;
      transform-origin: 200px 372px;
      animation: sombra 2.4s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(.985, 1.035); }
    }
    @keyframes acenar {
      0%   { transform: rotate(0deg); }
      10%  { transform: rotate(30deg); }
      18%  { transform: rotate(-14deg); }
      26%  { transform: rotate(30deg); }
      34%  { transform: rotate(-14deg); }
      42%  { transform: rotate(30deg); }
      54%  { transform: rotate(-6deg); }
      62%  { transform: rotate(3deg); }
      70%, 100% { transform: rotate(0deg); }
    }
    @keyframes balancar {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-6deg); }
    }
    @keyframes flor {
      0%, 4%   { transform: rotate(0deg); }
      14%      { transform: rotate(-7deg); }
      30%      { transform: rotate(5deg); }
      46%      { transform: rotate(-4deg); }
      60%, 100% { transform: rotate(0deg); }
    }
    @keyframes sobrancelhas {
      0%, 64%, 100% { transform: translateY(0); }
      8%, 50%       { transform: translateY(-7px); }
    }
    @keyframes piscar {
      0%, 46%, 50%, 100% { transform: scaleY(1); }
      48%                { transform: scaleY(.08); }
    }
    @keyframes sombra {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(.97); }
    }
    @media (prefers-reduced-motion: reduce) {
      #corpo, #braço-direito, #braço-esquerdo, #flor, #sobrancelhas, #olhos, #sombra { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="recorte-corpo"><ellipse cx="200" cy="228" rx="104" ry="122"/></clipPath>
  </defs>

  <ellipse id="sombra" cx="200" cy="372" rx="110" ry="12" fill="#000" opacity=".12"/>

  <!-- pés ficam fora do #corpo para permanecerem apoiados no chão -->
  <g id="pés">
    <ellipse cx="158" cy="356" rx="38" ry="20" fill="#4B9E2B"/>
    <ellipse cx="242" cy="356" rx="38" ry="20" fill="#4B9E2B"/>
    <ellipse cx="156" cy="352" rx="35" ry="17" fill="#5CB531"/>
    <ellipse cx="240" cy="352" rx="35" ry="17" fill="#5CB531"/>
  </g>

  <!-- #corpo agrupa as partes para que tudo respire junto sem descolar -->
  <g id="corpo">
    <!-- flor de três gomos (atrás do topo do corpo) -->
    <g id="flor">
      <circle cx="170" cy="112" r="25" fill="#E36F05"/>
      <circle cx="230" cy="112" r="25" fill="#E36F05"/>
      <circle cx="170" cy="107" r="24" fill="#FF8A12"/>
      <circle cx="230" cy="107" r="24" fill="#FF8A12"/>
      <circle cx="200" cy="100" r="29" fill="#E36F05"/>
      <circle cx="200" cy="94" r="28" fill="#FF8A12"/>
      <ellipse cx="191" cy="84" rx="8" ry="5" fill="#FFB057"/>
    </g>

    <!-- braços curvados pra cima, atrás do corpo -->
    <g id="braço-esquerdo">
      <path d="M118 252 Q62 254 60 194" fill="none" stroke="#4B9E2B" stroke-width="46" stroke-linecap="round" transform="translate(3 5)"/>
      <path d="M118 252 Q62 254 60 194" fill="none" stroke="#5CB531" stroke-width="46" stroke-linecap="round"/>
      <ellipse cx="54" cy="188" rx="6" ry="11" fill="#7FCD52" transform="rotate(-8 54 188)"/>
      <g fill="#1F5A32">
        <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" transform="translate(40 232) rotate(160)"/>
        <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" transform="translate(36 192) rotate(185)"/>
      </g>
    </g>
    <g id="braço-direito">
      <path d="M282 252 Q338 254 340 194" fill="none" stroke="#4B9E2B" stroke-width="46" stroke-linecap="round" transform="translate(3 5)"/>
      <path d="M282 252 Q338 254 340 194" fill="none" stroke="#5CB531" stroke-width="46" stroke-linecap="round"/>
      <ellipse cx="334" cy="188" rx="6" ry="11" fill="#7FCD52" transform="rotate(8 334 188)"/>
      <g fill="#1F5A32">
        <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" transform="translate(360 232) rotate(20)"/>
        <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" transform="translate(364 192) rotate(-5)"/>
      </g>
    </g>

    <!-- espinhos ao redor do corpo -->
    <g id="espinhos" fill="#1F5A32">
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(109.9 167.0) rotate(-153.8)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(97.0 211.0) rotate(-173.2)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(100.0 261.6) rotate(166.3)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(122.7 309.6) rotate(142.5)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(138.9 129.3) rotate(-130.4)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(290.1 167.0) rotate(-26.2)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(303.0 211.0) rotate(-6.8)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(300.0 261.6) rotate(13.7)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(277.3 309.6) rotate(37.5)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(261.1 129.3) rotate(-49.6)"/>
    </g>

    <!-- corpo oval com sombra lateral e gomos -->
    <g clip-path="url(#recorte-corpo)">
      <rect x="90" y="100" width="220" height="256" fill="#4B9E2B"/>
      <ellipse cx="190" cy="218" rx="102" ry="118" fill="#5CB531"/>
      <g fill="none" stroke="#4A9628" stroke-width="7" stroke-linecap="round">
        <path d="M146 116 Q112 228 146 342"/>
        <path d="M254 116 Q288 228 254 342"/>
        <path d="M180 108 Q172 140 174 164"/>
        <path d="M220 108 Q228 140 226 164"/>
        <path d="M200 290 Q198 320 200 348"/>
      </g>
      <ellipse cx="146" cy="150" rx="15" ry="30" fill="#7FCD52" transform="rotate(24 146 150)"/>
    </g>

    <!-- rosto -->
    <g id="rosto">
      <g id="sobrancelhas" fill="none" stroke="#1F5A32" stroke-width="8" stroke-linecap="round">
        <path d="M132 158 Q154 144 176 156"/>
        <path d="M268 158 Q246 144 224 156"/>
      </g>
      <g id="olhos">
        <ellipse cx="156" cy="200" rx="31" ry="35" fill="#FDF5E2"/>
        <ellipse cx="244" cy="200" rx="31" ry="35" fill="#FDF5E2"/>
        <ellipse cx="160" cy="204" rx="14" ry="17" fill="#1C2A28"/>
        <ellipse cx="240" cy="204" rx="14" ry="17" fill="#1C2A28"/>
        <circle cx="165" cy="197" r="5" fill="#FFFFFF"/>
        <circle cx="245" cy="197" r="5" fill="#FFFFFF"/>
      </g>
      <g id="boca">
        <path d="M174 238 H226 Q228 266 200 276 Q172 266 174 238 Z" fill="#6A2A14"/>
        <path d="M186 264 Q200 256 214 264 Q215 282 200 285 Q185 282 186 264 Z" fill="#FF7B1C"/>
      </g>
    </g>
  </g>
</svg>
