<svg id="tom-prancheta" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Tom escrevendo na prancheta">
  <style>
    #tom-prancheta * { transform-box: view-box; }
    /* respiração leve */
    #corpo { transform-origin: 200px 350px; animation: respirar 2.4s cubic-bezier(.45, 0, .55, 1) infinite; }
    /* mão do lápis rabiscando no papel */
    #mao-lapis { animation: rabiscar 2.4s ease-in-out infinite; }
    /* linhas do papel aparecendo uma por uma, como se ele estivesse escrevendo */
    .linha { stroke-dasharray: 1; stroke-dashoffset: 1; animation: escrever 2.4s linear infinite; animation-delay: var(--d); }
    /* olhos acompanham o lápis e de vez em quando olham pra frente */
    #pupilas { animation: olhar 4.8s ease-in-out infinite; }
    #olhos { transform-origin: 200px 200px; animation: piscar 4.8s ease-in-out infinite; }
    #flor { transform-origin: 200px 112px; animation: flor 2.4s ease-in-out infinite; }

    @keyframes respirar { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.99, 1.025); } }
    @keyframes rabiscar {
      0%   { transform: translate(0, 0) rotate(0deg); }
      10%  { transform: translate(-7px, 1px) rotate(-3deg); }
      20%  { transform: translate(-1px, 2px) rotate(1deg); }
      30%  { transform: translate(-9px, 3px) rotate(-3deg); }
      40%  { transform: translate(-2px, 9px) rotate(1deg); }
      50%  { transform: translate(-10px, 10px) rotate(-3deg); }
      60%  { transform: translate(-3px, 11px) rotate(1deg); }
      70%  { transform: translate(-9px, 17px) rotate(-2deg); }
      82%  { transform: translate(-2px, 18px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes escrever { 0% { stroke-dashoffset: 1; } 30%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes olhar { 0%, 62% { transform: translate(-6px, 6px); } 68%, 86% { transform: translate(0, 0); } 92%, 100% { transform: translate(-6px, 6px); } }
    @keyframes piscar { 0%, 70%, 74%, 100% { transform: scaleY(1); } 72% { transform: scaleY(.08); } }
    @keyframes flor { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) {
      #corpo, #mao-lapis, #pupilas, #olhos, #flor { animation: none; }
      .linha { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <clipPath id="recorte-corpo"><ellipse cx="200" cy="228" rx="104" ry="122"/></clipPath>
  </defs>

  <ellipse id="sombra" cx="200" cy="372" rx="110" ry="12" fill="#000" opacity=".12"/>
  <g id="pés">
    <ellipse cx="158" cy="356" rx="38" ry="20" fill="#4B9E2B"/>
    <ellipse cx="242" cy="356" rx="38" ry="20" fill="#4B9E2B"/>
    <ellipse cx="156" cy="352" rx="35" ry="17" fill="#5CB531"/>
    <ellipse cx="240" cy="352" rx="35" ry="17" fill="#5CB531"/>
  </g>

  <g id="corpo">
    <g id="flor">
      <circle cx="170" cy="112" r="25" fill="#E36F05"/>
      <circle cx="230" cy="112" r="25" fill="#E36F05"/>
      <circle cx="170" cy="107" r="24" fill="#FF8A12"/>
      <circle cx="230" cy="107" r="24" fill="#FF8A12"/>
      <circle cx="200" cy="100" r="29" fill="#E36F05"/>
      <circle cx="200" cy="94" r="28" fill="#FF8A12"/>
      <ellipse cx="191" cy="84" rx="8" ry="5" fill="#FFB057"/>
    </g>
    <g id="espinhos" fill="#1F5A32">
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(109.9 167.0) rotate(-153.8)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(97.0 211.0) rotate(-173.2)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(100.0 261.6) rotate(166.3)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(122.7 309.6) rotate(142.5)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(138.9 129.3) rotate(-130.4)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(290.1 167.0) rotate(-26.2)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(303.0 211.0) rotate(-6.8)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(300.0 261.6) rotate(13.7)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(277.3 309.6) rotate(37.5)"/>
      <rect x="-3" y="-4.5" width="22" height="9" rx="4.5" transform="translate(261.1 129.3) rotate(-49.6)"/>
    </g>
    <g clip-path="url(#recorte-corpo)">
      <rect x="90" y="100" width="220" height="256" fill="#4B9E2B"/>
      <ellipse cx="190" cy="218" rx="102" ry="118" fill="#5CB531"/>
      <g fill="none" stroke="#4A9628" stroke-width="7" stroke-linecap="round">
        <path d="M146 116 Q112 228 146 342"/>
        <path d="M254 116 Q288 228 254 342"/>
        <path d="M180 108 Q172 140 174 164"/>
        <path d="M220 108 Q228 140 226 164"/>
        <path d="M200 290 Q198 320 200 348"/>
      </g>

    </g>
    <g id="rosto">
      <g id="sobrancelhas" fill="none" stroke="#1F5A32" stroke-width="8" stroke-linecap="round">
        <path d="M132 158 Q154 144 176 156"/>
        <path d="M268 158 Q246 144 224 156"/>
      </g>
      <g id="olhos">
        <ellipse cx="156" cy="200" rx="31" ry="35" fill="#FDF5E2"/>
        <ellipse cx="244" cy="200" rx="31" ry="35" fill="#FDF5E2"/>
        <g id="pupilas">
          <ellipse cx="160" cy="204" rx="14" ry="17" fill="#1C2A28"/>
          <ellipse cx="240" cy="204" rx="14" ry="17" fill="#1C2A28"/>
          <circle cx="165" cy="197" r="5" fill="#FFFFFF"/>
          <circle cx="245" cy="197" r="5" fill="#FFFFFF"/>
        </g>
      </g>
      <!-- boquinha concentrada, com a língua de canto -->
      <path d="M186 254 Q200 266 214 254" fill="none" stroke="#6A2A14" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="208" cy="264" rx="6" ry="5" fill="#FF7B1C"/>
    </g>

    <!-- braço esquerdo segurando a prancheta pela borda -->
    <path d="M114 248 Q70 262 74 300" fill="none" stroke="#2F7A1E" stroke-width="47" stroke-linecap="round"/>
    <path d="M114 248 Q70 262 74 300" fill="none" stroke="#66C23A" stroke-width="40" stroke-linecap="round"/>
    <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" fill="#1F5A32" transform="translate(52 266) rotate(165)"/>

    <!-- prancheta -->
    <g id="prancheta" transform="rotate(-8 112 316)">
      <rect x="68" y="262" width="96" height="112" rx="10" fill="#B9773E"/>
      <rect x="68" y="262" width="96" height="106" rx="10" fill="#D4924F"/>
      <rect x="78" y="276" width="76" height="84" rx="4" fill="#FFFDF6"/>
      <rect x="98" y="254" width="36" height="16" rx="6" fill="#8D99A3"/>
      <g fill="none" stroke="#9AA6B0" stroke-width="4" stroke-linecap="round">
        <path class="linha" pathLength="1" style="--d:0s" d="M88 294 H142"/>
        <path class="linha" pathLength="1" style="--d:.5s" d="M88 310 H136"/>
        <path class="linha" pathLength="1" style="--d:1s" d="M88 326 H144"/>
        <path class="linha" pathLength="1" style="--d:1.5s" d="M88 342 H128"/>
      </g>
    </g>
    <!-- polegar por cima da borda: a prancheta fica na mão -->
    <ellipse cx="76" cy="300" rx="16.5" ry="14.5" fill="#2F7A1E"/>
    <ellipse cx="75" cy="299" rx="13" ry="11" fill="#66C23A"/>

    <!-- braço direito cruzando pra frente com o lápis -->
    <path d="M286 256 Q246 336 160 318" fill="none" stroke="#2F7A1E" stroke-width="45" stroke-linecap="round"/>
    <path d="M286 256 Q246 336 160 318" fill="none" stroke="#66C23A" stroke-width="38" stroke-linecap="round"/>
    <rect x="-3" y="-4.5" width="20" height="9" rx="4.5" fill="#1F5A32" transform="translate(300 270) rotate(30)"/>
    <g id="mao-lapis">
      <g transform="rotate(-38 150 300)">
        <rect x="143" y="262" width="14" height="56" rx="3" fill="#FFC93C"/>
        <rect x="150" y="262" width="7" height="56" rx="2" fill="#F2A900"/>
        <rect x="143" y="254" width="14" height="11" rx="3" fill="#F7A8C4"/>
        <path d="M143 318 H157 L150 334 Z" fill="#F6DEAE"/>
        <path d="M147.8 328 H152.2 L150 334 Z" fill="#3B3B3B"/>
      </g>
      <ellipse cx="160" cy="316" rx="17.5" ry="15.5" fill="#2F7A1E"/>
      <ellipse cx="159" cy="315" rx="14" ry="12" fill="#66C23A"/>
    </g>
  </g>
</svg>
